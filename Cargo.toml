[package]
name = "fastar-loader"
version = "0.2.0"
edition = "2021"

[lib]
name = "fastar_loader"
crate-type = ["cdylib"]

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
crc32fast = "1.5.3"
glob = "0.3.4"
numpy = "0.30.0"
page_size = "0.6.0"
rkyv = { version = "0.8.18", features = ["pointer_width_64"] }
shared_memory = "0.12.4"
rayon = "1.12.0"
indicatif = "0.18.6"
memmap2 = "0.9.12"

[dev-dependencies]
tempfile = "3.27.0"

[dependencies.noodles]
version = "0.118.0"
features = ["bgzf", "core", "fasta"]

[dependencies.pyo3]
version = "0.30.1"
features = ["extension-module", "generate-import-lib"]
